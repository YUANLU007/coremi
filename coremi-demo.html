<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>COREMI 科睿 — AI知识图谱演示</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
html,body{width:100%;height:100%;background:#080b12;color:#e8e6e0;overflow:hidden}

#app{display:flex;flex-direction:column;width:100%;height:100vh}
#topbar{height:40px;background:#0d1117;border-bottom:1px solid #1e2530;display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0;min-height:40px}
.logo{font-size:13px;font-weight:700;color:#5b9cf6;white-space:nowrap}
.title{font-size:11px;color:#4a5568;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{padding:3px 10px;font-size:11px;border:1px solid #2a3540;border-radius:20px;background:transparent;color:#6b7280;cursor:pointer;white-space:nowrap}
.tbtn.on{background:#1a3a5c;color:#5b9cf6;border-color:#1e4a7a}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:bl 1.4s infinite;flex-shrink:0}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.2}}

/* Desktop layout */
#body{flex:1;display:flex;overflow:hidden;min-height:0}
#canvaswrap{flex:1;position:relative;overflow:hidden;min-width:0}
#canvaswrap canvas{position:absolute;top:0;left:0}
#panel{width:260px;flex-shrink:0;border-left:1px solid #1a2030;display:flex;flex-direction:column;background:#0a0d14;overflow:hidden}

/* Mobile layout */
@media(max-width:600px){
  #body{flex-direction:column}
  #panel{width:100%;height:200px;border-left:none;border-top:1px solid #1a2030}
  .tbtn.mobi-hide{display:none}
  #leg{display:none}
}

.ph{padding:10px 12px;border-bottom:1px solid #1a2030;flex-shrink:0}
.pt{font-size:12px;font-weight:500;color:#ccc;margin-bottom:2px;line-height:1.4}
.pm{font-size:10px;color:#555}
.sc{color:#5b9cf6;font-weight:600}
#ptabs{display:flex;border-bottom:1px solid #1a2030;flex-shrink:0}
.ptab{flex:1;padding:7px 0;font-size:11px;text-align:center;cursor:pointer;color:#555;border-bottom:2px solid transparent;transition:all .15s}
.ptab.on{color:#5b9cf6;border-bottom-color:#5b9cf6}
#pbody{flex:1;overflow-y:auto;padding:8px 10px}
#pbody::-webkit-scrollbar{width:2px}
#pbody::-webkit-scrollbar-thumb{background:#222}

.am{margin-bottom:8px;padding:8px 10px;border-radius:8px;border:1px solid #1a2030;background:#0d1117;animation:fu .3s}
@keyframes fu{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.ah{display:flex;justify-content:space-between;margin-bottom:3px}
.an{font-size:11px;font-weight:600}
.at{font-size:10px;color:#374151}
.ax{font-size:11px;color:#aaa;line-height:1.5}
.ag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:8px;margin-top:4px}

.tr{display:flex;justify-content:space-between;align-items:center;padding:6px 2px;border-bottom:1px solid #111}
.ts{font-size:11px;font-weight:600;color:#ddd}
.tn{font-size:10px;color:#444;margin-top:1px}
.pos{color:#22c55e}.neg{color:#ef4444}

.di{margin-bottom:8px}
.dh{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.dl{color:#bbb;font-weight:500}
.db{height:3px;background:#111820;border-radius:2px;margin-bottom:2px}
.df{height:100%;border-radius:2px;transition:width 1s}
.dd{font-size:10px;color:#444}

#leg{position:absolute;bottom:10px;left:10px;z-index:5;background:#0d1117cc;border:1px solid #1e2530;border-radius:8px;padding:8px 10px}
.lr{display:flex;align-items:center;gap:6px;font-size:10px;color:#555;margin:2px 0}
.ld{width:6px;height:6px;border-radius:50%;flex-shrink:0}
#tip{position:absolute;pointer-events:none;z-index:20;background:#0d1117;border:1px solid #2a3540;border-radius:8px;padding:8px 12px;font-size:11px;max-width:190px;line-height:1.5;opacity:0;transition:opacity .15s;color:#9ca3af}
#tip b{color:#e2e8f0;display:block;margin-bottom:2px;font-size:12px}
#stepbar{position:absolute;top:0;left:0;right:0;height:2px;z-index:10}
#stepfill{height:100%;background:#5b9cf6;width:0;transition:width .4s}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="dot"></div>
    <span class="logo">COREMI 科睿</span>
    <span class="title">AI知识图谱 · 实时分析</span>
    <button class="tbtn on mobi-hide" id="bg" onclick="setMode('graph')">图谱</button>
    <button class="tbtn mobi-hide" id="bf" onclick="setMode('force')">力导向</button>
    <button class="tbtn" onclick="doRefresh()">↻</button>
  </div>
  <div id="body">
    <div id="canvaswrap">
      <canvas id="cv"></canvas>
      <div id="stepbar"><div id="stepfill"></div></div>
      <div id="leg">
        <div class="lr"><span class="ld" style="background:#5b9cf6"></span>基础设施</div>
        <div class="lr"><span class="ld" style="background:#22c55e"></span>AI模型</div>
        <div class="lr"><span class="ld" style="background:#a78bfa"></span>资本</div>
        <div class="lr"><span class="ld" style="background:#f97316"></span>供应链</div>
        <div class="lr"><span class="ld" style="background:#ef4444"></span>地缘</div>
        <div class="lr"><span class="ld" style="background:#6b7280"></span>监管</div>
      </div>
      <div id="tip"></div>
    </div>
    <div id="panel">
      <div class="ph">
        <div class="pt">Anthropic → AWS Trainium2 ×100万颗</div>
        <div class="pm">Reuters · 2026-04-13 · <span class="sc">94/100</span></div>
      </div>
      <div id="ptabs">
        <div class="ptab on" onclick="setTab('a')">智能体</div>
        <div class="ptab" onclick="setTab('s')">受益股</div>
        <div class="ptab" onclick="setTab('d')">维度</div>
      </div>
      <div id="pbody"></div>
    </div>
  </div>
</div>

<script>
var cv,ctx,W,H,mode='graph',tab='a',ns=[],drag=null,dox=0,doy=0,hov=null,ai=0;

var N=[
  {id:'news',lb:'Trainium2\n×100万颗',cat:'ai',  sz:21,fx:.50,fy:.44,info:'核心事件：Anthropic+AWS深度绑定'},
  {id:'amzn',lb:'亚马逊AWS',          cat:'inf', sz:18,fx:.28,fy:.26,info:'直接受益：独家算力合同 +4.2%'},
  {id:'nvda',lb:'英伟达',             cat:'inf', sz:17,fx:.72,fy:.23,info:'竞争压力：H100份额风险 -1.8%'},
  {id:'tsmc',lb:'台积电',             cat:'sup', sz:13,fx:.17,fy:.58,info:'Trainium2代工 3nm工艺受益'},
  {id:'anth',lb:'Anthropic',          cat:'ai',  sz:15,fx:.36,fy:.66,info:'算力10倍扩容，Claude推理提升'},
  {id:'msft',lb:'微软Azure',          cat:'inf', sz:12,fx:.76,fy:.58,info:'竞争格局被重新审视'},
  {id:'vc',  lb:'AI融资\n信号',       cat:'vc',  sz:13,fx:.54,fy:.17,info:'AI infra赛道估值支撑增强'},
  {id:'ge',  lb:'GE电力',             cat:'sup', sz:12,fx:.21,fy:.79,info:'200-500MW新增电力需求'},
  {id:'geo', lb:'中美科技\n博弈',     cat:'geo', sz:13,fx:.80,fy:.73,info:'美国AI算力自主化战略'},
  {id:'reg', lb:'反垄断',             cat:'reg', sz:11,fx:.63,fy:.82,info:'大规模算力集中引发FTC关注'},
  {id:'bot', lb:'具身智能',           cat:'ai',  sz:12,fx:.38,fy:.21,info:'推理算力扩容加速机器人inference'},
  {id:'hyn', lb:'SK海力士\nHBM',      cat:'sup', sz:12,fx:.08,fy:.40,info:'Trainium2 HBM大量需求'},
  {id:'lab', lb:'顶级实链\n信号',     cat:'vc',  sz:13,fx:.86,fy:.40,info:'第二家顶级实验室标准化Trainium'},
];
var E=[[0,1],[0,2],[0,4],[0,7],[0,4],[1,2],[1,7],[2,5],[0,6],[0,8],[3,4],[10,0],[11,1],[8,9],[6,12]];
var CC={ai:'#22c55e',inf:'#5b9cf6',sup:'#f97316',geo:'#ef4444',vc:'#a78bfa',reg:'#6b7280'};
var CL={ai:'#0d2e1a',inf:'#0d1e3a',sup:'#2e1a0a',geo:'#2e0d0d',vc:'#1e1030',reg:'#1a1c20'};

var AG=[
  {n:'News Fetcher',tg:'M2',tc:'#5b9cf6',tm:'09:00:12',tx:'抓取Reuters独家：Anthropic将在AWS部署100万颗Trainium2，P1级双源验证完成。'},
  {n:'Lab Chain',tg:'M11',tc:'#22c55e',tm:'09:00:18',tx:'顶级实链触发：Trainium2成为第二家顶级实验室标准算力，标准化评分8/10。'},
  {n:'Financial Analyst',tg:'M4',tc:'#a78bfa',tm:'09:00:31',tx:'DCF完成。AMZN算力收入+12%，NVDA数据中心份额下调3-5%风险。'},
  {n:'Beneficial Stocks',tg:'M6',tc:'#f97316',tm:'09:00:44',tx:'6大市场完成。AMZN+4.2%，GE+3.3%，中际旭创+2.1%，商汤+1.4%。'},
  {n:'PSC验证',tg:'M9',tc:'#ef4444',tm:'09:01:02',tx:'路透社+AWS官博双源确认，关键数字真实性100%，可发布。'},
  {n:'Editor',tg:'M8',tc:'#6b7280',tm:'09:01:15',tx:'审核通过。中文达财新，英文达WSJ标准，导语9/10，建议发布。'},
];
var SK=[
  {s:'AMZN',n:'亚马逊',m:'NASDAQ',c:'+4.2%',p:1},
  {s:'GE',n:'GE Vernova',m:'NYSE',c:'+3.3%',p:1},
  {s:'TSM',n:'台积电',m:'NYSE',c:'+2.1%',p:1},
  {s:'600570',n:'恒生电子',m:'A股',c:'+1.8%',p:1},
  {s:'9888',n:'百度',m:'港股',c:'+1.4%',p:1},
  {s:'NVDA',n:'英伟达',m:'NASDAQ',c:'-1.8%',p:0},
  {s:'MSFT',n:'微软',m:'NASDAQ',c:'-0.5%',p:0},
];
var DM=[
  {l:'芯片/算力',v:97,c:'#5b9cf6',d:'Trainium2规模化'},
  {l:'云基础设施',v:91,c:'#5b9cf6',d:'独家合同，Azure压力'},
  {l:'AI模型竞争',v:89,c:'#22c55e',d:'Claude算力×10'},
  {l:'顶级实链',v:85,c:'#a78bfa',d:'第二家实验室标准化'},
  {l:'VC融资',v:82,c:'#a78bfa',d:'AI infra赛道加速'},
  {l:'电力/能源',v:71,c:'#f97316',d:'200-500MW新增需求'},
  {l:'地缘政治',v:61,c:'#ef4444',d:'算力自主化战略'},
  {l:'监管',v:55,c:'#6b7280',d:'算力集中引发FTC关注'},
];

function boot(){
  cv=document.getElementById('cv');
  ctx=cv.getContext('2d');
  fit();
  ns=N.map(function(n){return Object.assign({},n,{px:n.fx*W,py:n.fy*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,al:0});});
  renderPanel();
  stepAnim();
  var iv=setInterval(function(){if(ai<AG.length){ai++;renderPanel();}else clearInterval(iv);},1800);
  requestAnimationFrame(loop);
}

function fit(){
  var p=document.getElementById('canvaswrap');
  var r=p.getBoundingClientRect();
  W=r.width; H=r.height;
  if(W<10||H<10){setTimeout(fit,100);return;}
  var dpr=window.devicePixelRatio||1;
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function stepAnim(){
  var t=0,iv=setInterval(function(){
    t+=2; document.getElementById('stepfill').style.width=Math.min(t,100)+'%';
    if(t>=100)clearInterval(iv);
  },70);
}

function loop(){
  ns.forEach(function(n){n.al=Math.min(1,n.al+.025);});
  if(mode==='force')applyForce();
  paint();
  requestAnimationFrame(loop);
}

function applyForce(){
  ns.forEach(function(a){
    ns.forEach(function(b){
      if(a===b)return;
      var dx=a.px-b.px,dy=a.py-b.py,d=Math.max(Math.hypot(dx,dy),1);
      var f=1300/(d*d); a.vx+=dx/d*f; a.vy+=dy/d*f;
    });
    E.forEach(function(e){
      var s=ns[e[0]],t=ns[e[1]];
      if(a===s||a===t){
        var o=a===s?t:s;
        var dx=o.px-a.px,dy=o.py-a.py,d=Math.max(Math.hypot(dx,dy),1);
        var f=(d-130)*.016; a.vx+=dx/d*f; a.vy+=dy/d*f;
      }
    });
    a.vx*=.84; a.vy*=.84; a.px+=a.vx; a.py+=a.vy;
    a.px=Math.max(a.sz+4,Math.min(W-a.sz-4,a.px));
    a.py=Math.max(a.sz+4,Math.min(H-a.sz-4,a.py));
  });
}

function paint(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#080b12'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.025)'; ctx.lineWidth=.5;
  for(var x=0;x<W;x+=55){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(var y=0;y<H;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  E.forEach(function(e,i){
    var a=ns[e[0]],b=ns[e[1]];
    var al=Math.min(a.al,b.al),h=hov===a||hov===b;
    ctx.beginPath(); ctx.moveTo(a.px,a.py); ctx.lineTo(b.px,b.py);
    ctx.strokeStyle=h?'rgba(91,156,246,'+al*.8+')':'rgba(255,255,255,'+al*.08+')';
    ctx.lineWidth=h?1.5:.5; ctx.stroke();
  });

  ns.forEach(function(n){
    var h=hov===n,r=n.sz+(h?5:0),c=CC[n.cat],l=CL[n.cat];
    ctx.globalAlpha=n.al;
    if(h){ctx.beginPath();ctx.arc(n.px,n.py,r+8,0,Math.PI*2);ctx.fillStyle=c+'18';ctx.fill();}
    ctx.beginPath();ctx.arc(n.px,n.py,r,0,Math.PI*2);
    ctx.fillStyle=h?c:l; ctx.fill();
    ctx.strokeStyle=c; ctx.lineWidth=h?2:.8; ctx.stroke();
    var lines=n.lb.split('\n');
    ctx.fillStyle=h?'#fff':c;
    ctx.font=(h?'600 ':'')+( n.sz>18?11:10)+'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    lines.forEach(function(ln,i){ctx.fillText(ln,n.px,n.py+(i-(lines.length-1)/2)*13);});
    ctx.globalAlpha=1;
  });

  if(hov){
    var tx=Math.min(hov.px+hov.sz+12,W-200),ty=Math.max(hov.py-40,4);
    ctx.fillStyle='#0d1117'; ctx.strokeStyle='#2a3540'; ctx.lineWidth=.8;
    ctx.beginPath(); ctx.rect(tx,ty,190,42); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#e2e8f0'; ctx.font='bold 11px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText(hov.lb.replace('\n',' '),tx+8,ty+8);
    ctx.fillStyle='#9ca3af'; ctx.font='10px sans-serif';
    ctx.fillText(hov.info,tx+8,ty+24);
  }
}

cv.addEventListener('mousemove',function(e){
  var r=cv.getBoundingClientRect(),sx=W/r.width,sy=H/r.height;
  var mx=(e.clientX-r.left)*sx,my=(e.clientY-r.top)*sy;
  if(drag){drag.px=mx-dox;drag.py=my-doy;return;}
  hov=null; ns.forEach(function(n){if(Math.hypot(mx-n.px,my-n.py)<n.sz+6)hov=n;});
  cv.style.cursor=hov?'pointer':'default';
});
cv.addEventListener('mousedown',function(e){
  var r=cv.getBoundingClientRect(),sx=W/r.width,sy=H/r.height;
  var mx=(e.clientX-r.left)*sx,my=(e.clientY-r.top)*sy;
  ns.forEach(function(n){if(Math.hypot(mx-n.px,my-n.py)<n.sz+6){drag=n;dox=mx-n.px;doy=my-n.py;}});
});
cv.addEventListener('mouseup',function(){drag=null;});
cv.addEventListener('touchstart',function(e){
  var t=e.touches[0],r=cv.getBoundingClientRect(),sx=W/r.width,sy=H/r.height;
  var mx=(t.clientX-r.left)*sx,my=(t.clientY-r.top)*sy;
  ns.forEach(function(n){if(Math.hypot(mx-n.px,my-n.py)<n.sz+10){drag=n;dox=mx-n.px;doy=my-n.py;}});
},{passive:true});
cv.addEventListener('touchmove',function(e){
  if(!drag)return; e.preventDefault();
  var t=e.touches[0],r=cv.getBoundingClientRect(),sx=W/r.width,sy=H/r.height;
  drag.px=(t.clientX-r.left)*sx-dox; drag.py=(t.clientY-r.top)*sy-doy;
},{passive:false});
cv.addEventListener('touchend',function(){drag=null;});

function setMode(m){
  mode=m;
  document.getElementById('bg').classList.toggle('on',m==='graph');
  document.getElementById('bf').classList.toggle('on',m==='force');
  if(m==='graph')ns.forEach(function(n){n.px=n.fx*W;n.py=n.fy*H;});
}

function doRefresh(){
  ns.forEach(function(n){n.vx=(Math.random()-.5)*4;n.vy=(Math.random()-.5)*4;n.al=.2;});
  stepAnim(); ai=0; renderPanel();
  var iv=setInterval(function(){if(ai<AG.length){ai++;renderPanel();}else clearInterval(iv);},1400);
}

function setTab(t){
  tab=t;
  document.querySelectorAll('.ptab').forEach(function(el,i){el.classList.toggle('on',['a','s','d'][i]===t);});
  renderPanel();
}

function renderPanel(){
  var el=document.getElementById('pbody');
  if(tab==='a'){
    el.innerHTML=AG.slice(0,ai).reverse().map(function(a){
      return '<div class="am"><div class="ah"><span class="an" style="color:'+a.tc+'">'+a.n+'</span><span class="at">'+a.tm+'</span></div>'
        +'<div class="ax">'+a.tx+'</div>'
        +'<span class="ag" style="background:'+a.tc+'20;color:'+a.tc+'">'+a.tg+'</span></div>';
    }).join('');
  }else if(tab==='s'){
    el.innerHTML=SK.map(function(s){
      return '<div class="tr"><div><div class="ts">'+s.s+'</div><div class="tn">'+s.n+' · '+s.m+'</div></div>'
        +'<div class="'+(s.p?'pos':'neg')+'" style="font-size:12px;font-weight:600">'+s.c+'</div></div>';
    }).join('');
  }else{
    el.innerHTML=DM.map(function(d){
      return '<div class="di"><div class="dh"><span class="dl">'+d.l+'</span><span style="color:'+d.c+';font-weight:600">'+d.v+'</span></div>'
        +'<div class="db"><div class="df" style="width:'+d.v+'%;background:'+d.c+'"></div></div>'
        +'<div class="dd">'+d.d+'</div></div>';
    }).join('');
  }
}

window.addEventListener('load',function(){setTimeout(boot,100);});
window.addEventListener('resize',function(){
  if(!cv||!ctx)return;
  fit();
  ns.forEach(function(n){n.px=n.fx*W;n.py=n.fy*H;});
});
</script>
</body>
</html>
